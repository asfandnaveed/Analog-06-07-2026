<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Burger</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-7 col-12 d-flex flex-column justify-content-center ps-5">

                  <!-- Review Box  -->
                  <div class="position-relative mb-4">
                    <div class="box-size position-absolute d-flex flex-column align-items-center justify-content-center">

                      <div class="d-flex gap-2">
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-fill"></i>
                        <i class="bi bi-star-half"></i>
                        <span>|</span>
                        <span>4.5</span>
                      </div>

                      <div>5k Happy review</div>

                    </div>
                    <div class="box-size box-rotate"></div>
                  </div>

                  <div class="h-subheading">Crispy, Crunchy, Veggie Deliciousness!</div>
                  <div class="h-heading">Burgers That Love the Earth!</div>

                  <div class="explore-div d-flex align-items-center gap-3">
                    <button class="btn btn-light ">Explore</button>
                    <i class="bi bi-play-circle"></i>
                    <a href="">Play Demo...</a>
                  </div>

                </div>
                <div class="col-lg-5 col-12 px-0">

                    <picture>
                      <source media="(max-width:992px)" srcset="assets/images/mobile_header.png">
                      <img class="img-fluid " src="assets/images/header.png" alt="">
                    </picture>

                    
                </div>
            </div>
        </div>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
