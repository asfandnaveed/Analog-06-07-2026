<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Javascript</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
      .eye-icon{
        padding-bottom: 0.1rem;
        padding-top: 0.1rem;
        padding-left: 1rem;
        padding-right: 1rem;
      }
    </style>
</head>

<body>
  <h1 id="heading">
    Hello, world!
  </h1>
  <button class="btn btn-warning" onclick="changeText()">Click Me</button>


  <div>
    <img id="img" src="assets/images/1.jpg" alt="">
  </div>
  <button class="btn btn-danger" onclick="changeImage();">Change Image</button>


  <div class="mt-5">
    <div id="result"></div>
    <label for="">Age</label>
    <input id="inp" type="number" class="form-control">
    <button class="btn btn-success" onclick="calAge();">Click to Calculate</button>
  </div>

  <div class="my-5">
    <label for="" class="form-label ">Password</label>
    <div class="position-relative w-25">
      <input id="inpPass" type="password" class="form-control ">
      <div onclick="viewPassword()" class="eye-icon bg-primary rounded-3  position-absolute top-50 end-0 translate-middle-y me-3 text-white">
        <i id="icon" class="bi bi-eye-fill"></i>
      </div>
    </div>

  </div>


  <script>

    function viewPassword(){

      var inpPass = document.getElementById("inpPass");

      var icon = document.getElementById("icon");
      

      if( inpPass.type == 'password'){
        inpPass.type = 'text';

        icon.classList.remove("bi-eye-fill");
        icon.classList.add("bi-eye-slash-fill");

      }else{
        inpPass.type='password';

        icon.classList.add("bi-eye-fill");
        icon.classList.remove("bi-eye-slash-fill");

      }

    }

    function calAge() {
      var age = document.getElementById("inp").value;

      if (age > 40) {
        //You are old 
        document.getElementById("result").innerHTML = `<div class="alert alert-danger">You are old !!</div>`;
      } else {
        // you are young !
        document.getElementById("result").innerHTML = `<div class="alert alert-success">You are Young !!</div>`;
      }

    }

    function changeImage() {

      document.getElementById("img").src = "assets/images/2.jpg";
    }

    function changeText() {

      var x = 7;
      let y = 10;
      const z = 32;

      var headingText = document.getElementById('heading');


      headingText.innerHTML = x + y + z;
      headingText.style.color = 'green';
      headingText.style.fontSize = '4rem';

    }

  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
