<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .main{
            width: 900px;
            height: 800px;
            border: 3px solid darkgoldenrod;
            position: relative;
        }
        .box1 {
            width: 400px;
            height: 400px;
            background-color: aquamarine;
            position: absolute;
            /* z-index: 4; */
        }

        .box2 {
            width: 300px;
            height: 300px;
            background-color: moccasin;
            position: absolute;
            /* z-index: 3; */
        }

        .box3 {
            width: 200px;
            height: 200px;
            background-color: mediumaquamarine;
            position: absolute;
            right: 0px;
            bottom: 0px;
        }
    </style>
</head>

<body>
    <!-- Tags -->
    <div class="main">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>

    </div>
</body>

</html>
